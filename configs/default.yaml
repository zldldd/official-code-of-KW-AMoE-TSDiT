# KW-AMoE-TSDiT Default Configuration
# =====================================

# ── DiT Backbone ──
dit_layers: 12
dit_hidden_dim: 768
dit_heads: 12
patch_size: 2
max_frames: 16
num_views: 6
image_height: 32
image_width: 48
latent_dim: 4

# ── KW-AMoE ──
num_experts: 8
top_k: 2
keyframe_ratio: 0.3
expert_hidden_ratio: 4

# ── TS-Mem ──
mem_alpha: 0.8
mem_beta: 0.3
mem_slots: 16

# ── Diffusion ──
timesteps: 1000
beta_start: 0.0001
beta_end: 0.02
ddim_steps: 50

# ── Loss weights ──
lambda_st: 0.1
lambda_moe: 0.01
temperature: 0.07

# ── Training ──
batch_size: 4
learning_rate: 0.0001
weight_decay: 0.0
total_steps: 100000
warmup_steps: 5000
log_interval: 100
eval_interval: 5000
save_interval: 10000
grad_clip: 1.0
mixed_precision: true

# ── Data ──
dataroot: ""
version: "v1.0-trainval"
num_workers: 4

# ── Output ──
output_dir: "./output"
checkpoint_dir: "./checkpoints"
